name: .NET build, test, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      DOTNET_gcServer: 0
      DOTNET_GCHeapHardLimit: '0x180000000'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure runner swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile_extra || sudo dd if=/dev/zero of=/mnt/swapfile_extra bs=1M count=8192
          sudo chmod 600 /mnt/swapfile_extra
          sudo mkswap /mnt/swapfile_extra
          sudo swapon /mnt/swapfile_extra

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          dotnet nuget add source --name "github-packages" --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true

      - name: Wait for upstream NuGet packages to be available
        run: |
          wait_for_restore() {
            local timeout=1200 elapsed=0
            echo "Waiting for upstream packages (Glacier.Inference 1.2.20 & Glacier.Cluster 1.0.0) to resolve via configured feeds..."
            until dotnet restore src/Glacier.Inference.Distributed/Glacier.Inference.Distributed.csproj > /dev/null 2>&1; do
              if [ $elapsed -ge $timeout ]; then
                echo "TIMEOUT waiting for upstream packages to restore. Diagnostics:"
                dotnet restore src/Glacier.Inference.Distributed/Glacier.Inference.Distributed.csproj
                exit 1
              fi
              echo "  Packages not yet resolvable, retrying in 30s (${elapsed}s elapsed)..."
              sleep 30; elapsed=$((elapsed+30))
            done
            echo "  All upstream dependencies successfully resolved."
          }
          wait_for_restore

      - name: Restore dependencies
        run: dotnet restore src/Glacier.Inference.Distributed/Glacier.Inference.Distributed.csproj

      - name: Build
        run: dotnet build src/Glacier.Inference.Distributed/Glacier.Inference.Distributed.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Glacier.Inference.Distributed.Tests/Glacier.Inference.Distributed.Tests.csproj --configuration Release

      - name: Pack Library
        run: dotnet pack src/Glacier.Inference.Distributed/Glacier.Inference.Distributed.csproj --configuration Release --output packages

      - name: Publish to nuget.org
        if: env.NUGET_API_KEY != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: dotnet nuget push "packages/*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate || true

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github-packages" --skip-duplicate || true
